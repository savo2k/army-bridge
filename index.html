<body>Загрузка…
<script>
(function () {
  var go = function (v) {
    var q = location.search ? location.search.slice(1) + '&' : '';
    location.replace('game.html?' + q + 'v=' + encodeURIComponent(v) + location.hash);
  };
  fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (v) { go(v.trim()); })
    .catch(function () { go(Date.now()); });
})();
</script>
